################
# GitLab CI for the Webship Portal site template (a drupal-recipe project).
#
# The drupal.org GitLab templates build a Drupal site with this recipe in
# recipes/webship_portal, then run composer-lint and cspell. The `recipe` job
# below installs Drupal from the recipe to prove that it applies.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_PHP: '8.4'
  DRUPAL_CORE: &drupal_core '11.4.x-dev'
  # No PHP, CSS, JavaScript or PHPUnit tests here: the recipe YAML is checked
  # by applying the recipe.
  SKIP_ESLINT: '1'
  SKIP_PHPCS: '1'
  SKIP_PHPSTAN: '1'
  SKIP_PHPUNIT: '1'
  SKIP_STYLELINT: '1'
  # Node modules are only needed by cspell, which installs them itself.
  _COMPOSER_YARN_INSTALL: '0'
  # composer-lint and cspell must pass.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'
  # The default content keeps the wording of Webship.co and its code samples.
  _CSPELL_IGNORE_PATHS: '"content/**"'

composer:
  variables:
    # The composer job sets its own DRUPAL_CORE: use the global value.
    DRUPAL_CORE: *drupal_core

# Install Drupal from the recipe, and check the result.
recipe:
  extends: .testing-job-base
  needs: [composer]
  # Only the database: no browser is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    EXPECTED_THEME: 'webtheme'
  script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin --site-name="Webship.co"
    - $DRUSH status --fields=drupal-version,db-status,theme
    - test "$($DRUSH config:get system.theme default --format=string)" = "$EXPECTED_THEME"
    # Web Admin makes UIkit Admin the administration theme.
    - test "$($DRUSH config:get system.theme admin --format=string)" = "uikit_admin"
    # The Webship features are installed: documentation, products and
    # releases, the blog, the newsletter form, social sharing and the
    # dashboards.
    - test "$($DRUSH config:get node.type.webblog type --format=string)" = "webblog"
    - test "$($DRUSH config:get node.type.webdoc type --format=string)" = "webdoc"
    - test "$($DRUSH config:get node.type.product type --format=string)" = "product"
    - test "$($DRUSH config:get node.type.release type --format=string)" = "release"
    - test "$($DRUSH config:get webform.webform.newsletter_subscribe id --format=string)" = "newsletter_subscribe"
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webshare
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webdashboard
    # The blocks of Webtheme are placed in the regions of its UIkit page.
    - test "$($DRUSH config:get block.block.webtheme_site_branding region --format=string)" = "navbar_left"
    - test "$($DRUSH config:get block.block.webtheme_main_menu region --format=string)" = "navbar_center"
    - test "$($DRUSH config:get block.block.webtheme_account_menu region --format=string)" = "navbar_right"
    - test "$($DRUSH config:get block.block.webtheme_main_menu_offcanvas region --format=string)" = "offcanvas"
    - test "$($DRUSH config:get block.block.webtheme_account_menu_offcanvas region --format=string)" = "offcanvas"
    - test "$($DRUSH config:get block.block.webtheme_footer_menu region --format=string)" = "footer"
    - test "$($DRUSH config:get block.block.webtheme_social_media_menu region --format=string)" = "footer"
    - test "$($DRUSH config:get block.block.webtheme_content region --format=string)" = "content"
    # One page layout frames every page, and a page can carry its own display.
    - test "$($DRUSH config:get display_builder_page_layout.page_layout.default id --format=string)" = "default"
    - test "$($DRUSH php:eval 'print count(\Drupal::entityTypeManager()->getStorage("page_layout")->loadByProperties(["status" => TRUE]));')" = "1"
    - test "$($DRUSH config:get core.entity_view_display.node.webpage.full third_party_settings.display_builder.override_field --format=string)" = "field_page_display"
    # The bulk actions of the content overview.
    - test "$($DRUSH config:get system.action.node_unpublish_action id --format=string)" = "node_unpublish_action"
    # The site is named Webship.co, with no slogan, and the navbar shows only
    # the logo.
    - test "$($DRUSH config:get system.site name --format=string)" = "Webship.co"
    - test -z "$($DRUSH config:get system.site slogan --format=string)"
    - test "$($DRUSH php:eval 'print (int) \Drupal::config("block.block.webtheme_site_branding")->get("settings.use_site_name");')" = "0"
    - test "$($DRUSH php:eval 'print (int) \Drupal::config("block.block.webtheme_site_branding")->get("settings.use_site_slogan");')" = "0"
    # The default content of the template is imported: the pages, the
    # documentation, the products with their releases, the blog posts and
    # the media images.
    # The front page and the pages of the main menu resolve.
    - test "$($DRUSH config:get system.site page.front --format=string)" = "/home"
    # The main menu has one Products link.
