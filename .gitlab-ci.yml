################
# GitLab CI for the Webship Portal site template (a drupal-recipe project).
#
# The drupal.org GitLab templates build a Drupal site with this recipe in
# recipes/webship_portal, then run composer-lint and cspell. The `recipe` job
# below installs Drupal from the recipe to prove that it applies.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Also check that Composer resolves on the next major Drupal version.
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  _TARGET_PHP: '8.4'
  DRUPAL_CORE: &drupal_core '11.4.x-dev'
  # No PHP, CSS, JavaScript or PHPUnit tests here: the recipe YAML is checked
  # by applying the recipe.
  SKIP_ESLINT: '1'
  SKIP_PHPCS: '1'
  SKIP_PHPSTAN: '1'
  SKIP_PHPUNIT: '1'
  SKIP_STYLELINT: '1'
  # Node modules are only needed by cspell, which installs them itself.
  _COMPOSER_YARN_INSTALL: '0'
  # composer-lint and cspell must pass.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'
  # The default content keeps the wording of Webship.co and its code samples.
  _CSPELL_IGNORE_PATHS: '"content/**"'

composer:
  variables:
    # The composer job sets its own DRUPAL_CORE: use the global value.
    DRUPAL_CORE: *drupal_core

# Install Drupal from the recipe, and check the result.
recipe:
  extends: .testing-job-base
  needs: [composer]
  # Only the database: no browser is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    EXPECTED_THEME: 'webtheme'
  script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin --site-name="Webship.co"
    - $DRUSH status --fields=drupal-version,db-status,theme
    - test "$($DRUSH config:get system.theme default --format=string)" = "$EXPECTED_THEME"
    # Web Admin makes UIkit Admin the administration theme.
    - test "$($DRUSH config:get system.theme admin --format=string)" = "uikit_admin"
    # The Webship features are installed: documentation, products and
    # releases, the blog, the newsletter form, social sharing and the
    # dashboards.
    - test "$($DRUSH config:get node.type.webblog type --format=string)" = "webblog"
    - test "$($DRUSH config:get node.type.webdoc type --format=string)" = "webdoc"
    - test "$($DRUSH config:get node.type.product type --format=string)" = "product"
    - test "$($DRUSH config:get node.type.release type --format=string)" = "release"
    - test "$($DRUSH config:get webform.webform.newsletter_subscribe id --format=string)" = "newsletter_subscribe"
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webshare
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webdashboard
    # The blocks of Webtheme are placed in the regions of its UIkit page.
    - test "$($DRUSH config:get block.block.webtheme_site_branding region --format=string)" = "navbar_left"
    - test "$($DRUSH config:get block.block.webtheme_main_menu region --format=string)" = "navbar_center"
    - test "$($DRUSH config:get block.block.webtheme_account_menu region --format=string)" = "navbar_right"
    - test "$($DRUSH config:get block.block.webtheme_main_menu_offcanvas region --format=string)" = "offcanvas"
    - test "$($DRUSH config:get block.block.webtheme_account_menu_offcanvas region --format=string)" = "offcanvas"
    - test "$($DRUSH config:get block.block.webtheme_footer_menu region --format=string)" = "footer"
    - test "$($DRUSH config:get block.block.webtheme_social_media_menu region --format=string)" = "footer"
    - test "$($DRUSH config:get block.block.webtheme_content region --format=string)" = "content"
    # One page layout frames every page, and a page can carry its own display.
    - test "$($DRUSH config:get display_builder_page_layout.page_layout.default id --format=string)" = "default"
    - test "$($DRUSH php:eval 'print count(\Drupal::entityTypeManager()->getStorage("page_layout")->loadByProperties(["status" => TRUE]));')" = "1"
    - test "$($DRUSH config:get core.entity_view_display.node.webpage.full third_party_settings.display_builder.override_field --format=string)" = "field_page_display"
    # The bulk actions of the content overview.
    - test "$($DRUSH config:get system.action.node_unpublish_action id --format=string)" = "node_unpublish_action"
    # The site is named Webship.co, with no slogan, and the navbar shows only
    # the logo.
    - test "$($DRUSH config:get system.site name --format=string)" = "Webship.co"
    - test -z "$($DRUSH config:get system.site slogan --format=string)"
    - test "$($DRUSH php:eval 'print (int) \Drupal::config("block.block.webtheme_site_branding")->get("settings.use_site_name");')" = "0"
    - test "$($DRUSH php:eval 'print (int) \Drupal::config("block.block.webtheme_site_branding")->get("settings.use_site_slogan");')" = "0"
    # The default content of the template is imported: the pages, the
    # documentation, the products with their releases, the blog posts and
    # the media images.
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "webpage")->count()->execute();')" -gt 6
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "webdoc")->count()->execute();')" -gt 2
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "product")->count()->execute();')" -gt 5
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "release")->count()->execute();')" -gt 14
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "webblog")->count()->execute();')" -gt 14
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("media")->accessCheck(FALSE)->condition("bundle", "image")->count()->execute();')" -gt 20
    # The front page and the pages of the main menu resolve.
    - test "$($DRUSH config:get system.site page.front --format=string)" = "/home"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/home");')" != "/home"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/products");')" != "/products"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/about-us");')" != "/about-us"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/contact");')" != "/contact"
    # A page prints one h1: the page layout puts the page title in a heading,
    # and the hero of the front page has its own. The pages are asked over
    # HTTP, as a visitor gets them.
    - php -d memory_limit=-1 -S 127.0.0.1:8080 -t $CI_PROJECT_DIR/$_WEB_ROOT $CI_PROJECT_DIR/$_WEB_ROOT/.ht.router.php > /dev/null 2>&1 &
    - export SERVER_PID=$!
    - sleep 3
    - export H1_COUNT='print substr_count((string) file_get_contents("http://127.0.0.1:8080" . $argv[1], false, stream_context_create(["http" => ["ignore_errors" => true]])), "<h1");'
    - test "$(php -r "$H1_COUNT" /)" -eq 1
    - test "$(php -r "$H1_COUNT" /about-us)" -eq 1
    - test "$(php -r "$H1_COUNT" /blog)" -eq 1
    - test "$(php -r "$H1_COUNT" /blog/webship-js-advanced-screenshots)" -eq 1
    - test "$(php -r "$H1_COUNT" /no-such-page)" -eq 1
    - kill $SERVER_PID
    # The main menu has one Products link.
    - test "$($DRUSH php:eval 'print count(\Drupal::entityTypeManager()->getStorage("menu_link_content")->loadByProperties(["menu_name" => "main", "title" => "Products"]));')" = "1"

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: 'ai,ai_agents,ai_assistant_api,ai_chatbot,ai_content_suggestions,ai_image_alt_text,ai_logging,ai_penpot,ai_playwright,ai_provider_anthropic,ai_provider_huggingface,ai_provider_ollama,ai_provider_openai,ai_provider_xai,ai_translate,antibot,autocomplete_deluxe,automatic_updates,better_exposed_filters,captcha,coffee,config_filter,config_ignore,config_import_single,config_rewrite,config_split,config_update,config_update_ui,consumers,crop,ctools,dashboards,display_builder,display_builder_entity_view,display_builder_page_layout,display_builder_ui,display_builder_views,drupical,easy_breadcrumb,easy_encryption,editor_advanced_link,embed,entity_embed,field_group,field_validation,flood_control,focal_point,friendlycaptcha,gemini_provider,google_analytics,google_tag,honeypot,inline_entity_form,jsonapi_extras,key,klaro,login_emailusername,manage_display,media_directories_editor,media_directories_ui,media_remote_audio,media_remote_image,metatag,openapi,openapi_jsonapi,openapi_rest,openapi_ui,openapi_ui_swagger,pathauto,recaptcha_v3,redirect,restui,sam,schema_metatag,schemata,schemata_json_schema,seckit,security_review,shield,simple_oauth,smart_trim,tagify,token,token_filter,tracker,user_redirect,view_password,views_bulk_edit,views_bulk_operations,webform,xmlsitemap,yoast_seo'

# The webship-js suite (tests/README.md) on a site installed from this recipe:
# the site build creates the accounts of cucumber.js (worldParameters.users)
# with drush, with passwords made for the job; the suite only logs in.
webship-js-test:
  extends: .testing-job-base
  needs: [composer]
  # Playwright brings its own Chromium: only the database is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USER: "webmaster"
    DRUPAL_ADMIN_MAIL: "webmaster@example.test"
    DRUPAL_EDITOR_USER: "content_editor_user"
    DRUPAL_EDITOR_MAIL: "content_editor_user@example.test"
    DRUPAL_AUTHENTICATED_USER: "authenticated_user"
    DRUPAL_AUTHENTICATED_MAIL: "authenticated_user@example.test"
    LAUNCH_URL: "http://localhost"
    SLOW_MO: "0"
    FORCE_COLOR: "1"
  before_script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    # Web server.
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # Test account passwords, for this job only.
    - export DRUPAL_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_EDITOR_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_AUTHENTICATED_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    # The site, from this recipe, with the Webmaster account.
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name="$DRUPAL_ADMIN_USER" --account-mail="$DRUPAL_ADMIN_MAIL"
      --account-pass="$DRUPAL_ADMIN_PASS" --site-name="Webship"
    # The other accounts of cucumber.js (worldParameters.users).
    - $DRUSH user:create "$DRUPAL_EDITOR_USER" --mail="$DRUPAL_EDITOR_MAIL" --password="$DRUPAL_EDITOR_PASS"
    - $DRUSH user:role:add content_editor "$DRUPAL_EDITOR_USER"
    - $DRUSH user:create "$DRUPAL_AUTHENTICATED_USER" --mail="$DRUPAL_AUTHENTICATED_MAIL" --password="$DRUPAL_AUTHENTICATED_PASS"
    # A test runner has no mail server: collect the mails instead of sending them.
    - $DRUSH config:set system.mail interface.default test_mail_collector -y
    # Drush ran as root: give the files it wrote back to the web server.
    - chown -R www-data:www-data $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - 'curl -s -o /dev/null -w "front page HTTP=%{http_code}\n" http://localhost/'
    # Node.js 24 and the suite with its browser.
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # The webship-js install script may write a cucumber.js of its own: keep this one.
    - cp cucumber.js .cucumber.js.bak
    - npm install --no-audit --no-fund
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  allow_failure: false
