                                value: <h3>We LOVE to help with:</h3><ul class="uk-list uk-list-bullet"><li>Automated Functional Testing setup and configurations for projects.</li><li>Setup CI/CD robot servers, and Web-drivers to work on a local development and private CI/CD servers.</li><li>Setup of Selenium robot config to run with public or private CI/CD remote servers. like <a href="https://github.com/features/actions">GitHub Actions</a>, <a href="https://docs.gitlab.com/ee/ci/">GitLab CI</a>, <a href="https://bitbucket.org/product/features/pipelines">Bitbucket Pipelines</a>.</li><li>Writing Cucumber descriptions, Gherkin scripts for web apps.</li></ul>
