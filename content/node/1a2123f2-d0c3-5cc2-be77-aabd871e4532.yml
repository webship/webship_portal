    - value: |-
        <p>At Webship.co, we collect and manage user data according to the following Privacy Policy.</p>
        <p><strong>Data Collected</strong><br>We collect information you provide directly to us. For example, we collect information when you create an account, subscribe, participate in any interactive features of our services, fill out a form, request customer support or otherwise communicate with us. The types of information we may collect include your name, email address, postal address, and other contact or identifying information you choose to provide.</p>
        <p>We collect anonymous data from every visitor of the Website to monitor traffic and fix bugs. For example, we collect information like web requests, the data sent in response to such requests, the Internet Protocol address, the browser type, the browser language, and a timestamp for the request.</p>
        <p>We also use various technologies to collect information, and this may include sending cookies to your computer. Cookies are small data files stored on your hard drive or in your device memory that helps us to improve our services and your experience, see which areas and features of our services are popular and count visits. We may also collect information using web beacons (also known as "tracking pixels"). Web beacons are electronic images that may be used in our services or emails and to track count visits or understand usage and campaign effectiveness.</p>
        <p><strong>Use of the Data</strong><br>We only use your personal information to provide you the Webship.co services or to communicate with you about the Website or the services.</p>
        <p>We employ industry standard techniques to protect against unauthorized access of data about you that we store, including personal information.</p>
        <p>We do not share personal information you have provided to us without your consent, unless:</p>
        <ul class="uk-list uk-list-bullet"><li>Doing so is appropriate to carry out your own request</li><li>We believe it's needed to enforce our legal agreements or that is legally required</li><li>We believe it's needed to detect, prevent or address fraud, security or technical issues</li></ul>
        <p><br><strong>Sharing of Data</strong><br>We don't share your personal information with third parties. Aggregated, anonymized data is periodically transmitted to external services to help us improve the Website and service.</p>
        <p>We may allow third parties to provide analytics services. These third parties may use cookies, web beacons and other technologies to collect information about your use of the services and other websites, including your IP address, web browser, pages viewed, time spent on pages, links clicked and conversion information.</p>
        <p>We also use social buttons provided by services like Twitter, LinkedIn and Facebook. Your use of these third party services is entirely optional. We are not responsible for the privacy policies and/or practices of these third party services, and you are responsible for reading and understanding those third party services' privacy policies.</p>
        <p><strong>Cookies</strong><br>We may use cookies on our site to remember your preferences.</p>
        <p>For more general information on cookies, please read "What Are Cookies".</p>
        <p><strong>Opt-Out, Communication Preferences</strong><br>You may modify your communication preferences and/or opt-out from specific communications at any time. Please specify and adjust your preferences.</p>
        <p><strong>Security</strong><br>We take reasonable steps to protect personally identifiable information from loss, misuse, and unauthorized access, disclosure, alteration, or destruction. But, you should keep in mind that no Internet transmission is ever completely secure or error-free. In particular, email sent to or from the Sites may not be secure.</p>
        <p><strong>About Children</strong><br>The Website is not intended for children under the age of 13. We do not knowingly collect personally identifiable information via the Website from visitors in this age group.</p>
        <p><strong>Changes to the Privacy Policy</strong><br>We may amend this Privacy Policy from time to time. Use of information we collect now is subject to the Privacy Policy in effect at the time such information is used.</p>
        <p>If we make major changes in the way we collect or use information, we will notify you by posting an announcement on the Website or sending you an email.</p>
      format: full_html
      summary: ''
