  field_body:
    - value: |-
        <p>We’ve unified all recent improvements into a stable version, bringing a smoother and more powerful testing experience. The biggest highlight is the full transition to Playwright, giving better performance, flexibility, and modern browser control.</p>
        <p>Along the way, we enhanced configuration handling and introduced new capabilities like starting the browser in maximized mode, making your automated tests closer to real user behavior.</p>
        <p><strong>Changes since Webship-js 1.0.47:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Start a 2.0.x branch and switch all step definitions to Playwright <a href="https://github.com/webship/webship-js/issues/241">#241</a></li></ul>
        <p><strong>Updates since Webship-js </strong><strong>2.0.0-alpha1</strong><strong>:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Activated playwrightConfig in step definitions <a href="https://github.com/webship/webship-js/issues/244">#244</a></li></ul>
        <p><strong>Added since Webship-js </strong><strong>2.0.0-beta1</strong><strong>:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Added start-maximized config for the browser <a href="https://github.com/webship/webship-js/issues/246">#246</a></li></ul>
      format: full_html
