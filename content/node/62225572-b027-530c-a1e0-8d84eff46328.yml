  body:
    -
      value: |-
        <p>A site template is a Drupal recipe that builds a complete site. Pick the one that matches your project.</p>
        <table class="uk-table uk-table-divider uk-table-small">
          <thead><tr><th>Site template</th><th>For</th></tr></thead>
          <tbody>
            <tr><td>Website Starter</td><td>A company site or a blog, with a UIkit showcase.</td></tr>
            <tr><td>Webship Starter</td><td>Documentation, products and releases, in UI Suite UIkit.</td></tr>
            <tr><td>Webship Portal</td><td>A software portal like Webship.co, in Webtheme.</td></tr>
          </tbody>
        </table>
        <h2>From the installer</h2>
        <p>Open the site in the browser: the Webship installer lists the site templates. Choose one and continue.</p>
        <img src="/sites/default/files/webship-portal/developer-laptop-code.jpg" data-entity-type="file" data-entity-uuid="1c8572c9-9fde-580c-b429-8a7348519fca" width="1800" height="1200" alt="A developer writing code on a laptop." class="uk-border-rounded uk-box-shadow-medium">
        <h2>With Drush</h2>
        <pre><code>ddev drush site:install recipes/webship_portal -y
        ddev launch</code></pre>

        <p class="uk-margin-large-top"><a class="uk-button uk-button-default" href="/docs">Back to the documentation</a></p>
      format: full_html
      summary: ''
