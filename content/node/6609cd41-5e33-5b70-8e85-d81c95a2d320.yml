  body:
    -
      value: |-
        <p>Every content type of the site is displayed with Display Builder, so you arrange pages without writing templates.</p>
        <img src="/sites/default/files/webship-portal/code-editor-laptop.jpg" data-entity-type="file" data-entity-uuid="451c9dff-6ef7-5b16-92f6-ee5f64482f7c" width="1800" height="1195" alt="A code editor with test code on a laptop screen." class="uk-border-rounded uk-box-shadow-medium">
        <h2>Edit a display</h2>
        <ol>
          <li>Go to <em>Structure &gt; Content types</em> and choose <em>Manage display</em> for a content type.</li>
          <li>Open the Display Builder editor, and drag components, blocks and fields from the libraries.</li>
          <li>Preview the result, then publish.</li>
        </ol>
        <p>Undo, redo and the history keep every change, so you can go back to an earlier version.</p>

        <p class="uk-margin-large-top"><a class="uk-button uk-button-default" href="/docs">Back to the documentation</a></p>
