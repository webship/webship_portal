  body:
    - value: |-
        <p>Migrated all step definitions in <strong>webship-js</strong> to <strong>Playwright</strong>. This change removes the need for a separate WebDriver server, simplifying setup and improving test speed and reliability. All step definitions in tests/step-definitions/webship.js were rewritten using the Playwright API while keeping the <strong>Cucumber.js</strong> layer unchanged, so existing .feature files require no modifications. Browser lifecycle is now managed per scenario via Cucumber hooks, and the browser (chromium, firefox, webkit) can be selected using the BROWSER environment variable.</p>
        <p><strong>Changes since Webship-js 1.0.47:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Start a 2.0.x branch and switch all step definitions to Playwright <a href="https://github.com/webship/webship-js/issues/241">#241</a></li></ul>
