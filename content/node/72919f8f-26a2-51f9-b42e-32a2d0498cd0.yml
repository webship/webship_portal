  body:
    - value: |-
        <p>Previously, webship.js loaded its own internal playwright.config, ignoring any project-level settings. Now it loads the config from the project's root directory using process.cwd(), so projects can control Playwright settings like headless and slowMo from their own playwright.config.ts.</p>
        <p><strong>Updates since Webship-js </strong><strong>2.0.0-alpha1</strong><strong>:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Activated playwrightConfig in step definitions <a href="https://github.com/webship/webship-js/issues/244">#244</a></li></ul>
