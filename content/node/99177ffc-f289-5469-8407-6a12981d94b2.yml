  field_body:
    - value: |-
        <p>This batch covers architecture and command documentation, the refactoring of the Diffy step-pack into a standalone plugin, and keeping all guidelines synchronized with the latest correct paths.</p>
        <p><strong>Added since Webship-js 2.0.4:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Docs: rewrite CLAUDE.md with commands, architecture, and the local AI agent/skill map (<a href="https://github.com/webship/webship-js/issues/298">#298</a>)</li><li>Docs: sync AGENTS.md with the rewritten CLAUDE.md (<a href="https://github.com/webship/webship-js/issues/300">#300</a>)</li><li>Docs: CLAUDE.md points at the unscoped diffy-steps require path (<a href="https://github.com/webship/webship-js/issues/304">#304</a>)</li><li>Docs: CLAUDE.md names the old <a href="https://github.com/webship">@webship</a> scope for diffy-steps (<a href="https://github.com/webship/webship-js/issues/306">#306</a>)</li></ul>
        <p><strong>Changes since Webship-js 2.0.4:</strong></p>
        <ul class="uk-list uk-list-bullet"><li><p>Refactor: extract the Diffy step-pack into its own diffy-steps plugin (<a href="https://github.com/webship/webship-js/issues/302">#302</a>)</p>
        </li></ul>
      format: full_html
