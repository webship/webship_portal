  body:
    - value: |-
        <p>Webship-js 2.0.6 separates the visual regression while keeping Gherkin steps intact. Additionally, this release fixes smart waiting on pages that never reach network idle by giving each settle stage its own time budget, and updates structural accessibility probes to skip hidden elements in line with axe.</p>
        <p><strong>Fixed since Webship-js 2.0.5:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>Fix: give each smartSettle stage its own share of the budget (<a href="https://github.com/webship/webship-js/issues/309">#309</a>)</li><li>Fix: make the a11y impact gate cumulative, skip hidden elements, and add the full check (<a href="https://github.com/webship/webship-js/issues/310">#310</a>)</li></ul>
      format: full_html
      summary: Webship-js 2.0.6 separates the visual regression while keeping Gherkin steps intact. Additionally, this release fixes smart waiting on pages that never reach network idle by giving each settle stage its own time budget, and updates structural accessibility probes to skip hidden elements in line with axe.
