  field_body:
    - value: |-
        <p>This release brings three major improvements to webship-js. On the testing side, JavaScript.steps.js now supports configurable warn/fail/off modes with before/after scenario hooks, and Playwright video recording has been integrated with dedicated start/stop/save steps. Error messages are now human-readable through the new friendly() and humanize() helpers. CI/CD support has expanded dramatically, ready-to-use config files are now shipped for virtually every major platform, including Jenkins, Azure Pipelines, AWS CodeBuild, Google Cloud Build, TeamCity, Semaphore, Drone CI, Harness CI, Bamboo, and Codefresh, alongside a modernised CircleCI image and a revived Travis CI config. Finally, the documentation has been restructured with a renamed index file, a fully regenerated 407-step reference, and dedicated setup sections for the four Tier 1 platforms: GitHub Actions, GitLab CI, Bitbucket Pipelines, and CircleCI.</p>
        <p><strong>Added since Webship-js 2.0.3:</strong></p>
        <ul class="uk-list uk-list-bullet"><li>javascript.steps.js: configurable warn/fail/off mode + before/after scenario hooks (<a href="https://github.com/webship/webship-js/issues/279">#279</a>)</li><li>CircleCI: use cimg/node:20.20, drop apt upgrade and unused tools (<a href="https://github.com/webship/webship-js/issues/280">#280</a>)</li><li>Travis CI: replace dead .travis-ci.yml, modernise config, add README badge (<a href="https://github.com/webship/webship-js/issues/281">#281</a>)</li><li>Jenkins: ship Jenkinsfile + CI/CD setup doc (<a href="https://github.com/webship/webship-js/issues/282">#282</a>)</li><li>Azure Pipelines: ship azure-pipelines.yml + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/283">#283</a>)</li><li>AWS CodeBuild: ship buildspec.yml + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/284">#284</a>)</li><li>Google Cloud Build: ship cloc sectudbuild.yaml + CI/CD doion (<a href="https://github.com/webship/webship-js/issues/285">#285</a>)</li><li>TeamCity: ship Kotlin DSL config + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/286">#286</a>)</li><li>Semaphore: ship .semaphore/semaphore.yml + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/287">#287</a>)</li><li>Drone CI + Woodpecker + Forgejo Actions: ship .drone.yml + docs (<a href="https://github.com/webship/webship-js/issues/288">#288</a>)</li><li>Harness CI: ship .harness pipeline + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/289">#289</a>)</li><li>Bamboo Data Center: ship bamboo-specs YAML + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/290">#290</a>)</li><li>Codefresh: ship codefresh.yml + CI/CD doc section (<a href="https://github.com/webship/webship-js/issues/291">#291</a>)</li><li>Docs: Octopus Deploy (CD-only) + Codeship retirement note (<a href="https://github.com/webship/webship-js/issues/292">#292</a>)</li><li>Docs: add Tier 1 CI sections (GitHub Actions, GitLab, Bitbucket, CircleCI) (<a href="https://github.com/webship/webship-js/issues/293">#293</a>)</li><li>Docs: rename docs/index.md → docs/README.md + regenerate 407-step per-file index (<a href="https://github.com/webship/webship-js/issues/294">#294</a>)</li><li>Video recording: Playwright recordVideo integration with start/stop/save steps (<a href="https://github.com/webship/webship-js/issues/295">#295</a>)</li><li>Tester-friendly error handling: structured friendly() + humanize() + stdout filter (<a href="https://github.com/webship/webship-js/issues/296">#296</a>)</li></ul>
      format: full_html
