  body:
    - value: |-
        <p>Diffy-specific Cucumber step definitions for Webship-js. The plugin captures full-page Playwright screenshots at multiple breakpoints and drives Diffy visual-regression comparisons through the Diffy REST API, so you can express visual checks as readable Gherkin instead of hand-rolling API calls.</p>
        <p>It is a plugin for Webship-js: it does not run standalone. It ships one file of step definitions that you add to a Webship-js test project.</p><pre><code class="language-shell">npm install --save-dev webship-js @webship-js/diffy-steps</code></pre>
        <p><a class="uk-button uk-button-primary uk-margin-small-right uk-margin-small-bottom" href="https://github.com/webship/diffy-steps">Diffy steps on GitHub</a> <a class="uk-button uk-button-default uk-margin-small-right uk-margin-small-bottom" href="https://www.npmjs.com/package/@webship-js/diffy-steps">Diffy steps on npm</a></p>
      format: full_html
