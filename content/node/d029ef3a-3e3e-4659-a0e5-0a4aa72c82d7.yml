      value: |-
        <div class="uk-section uk-section-primary uk-light uk-padding uk-border-rounded uk-margin-large-bottom">
          <div class="uk-grid uk-grid-large uk-flex-middle" uk-grid>
            <div class="uk-width-1-2@m">
              <h1 class="uk-heading-medium">Ship websites in a swift way</h1>
              <p class="uk-text-large">Webship brings Drupal site templates, an installer, documentation, products and releases together, ready to install with Composer and DDEV.</p>
              <p>
                <a class="uk-button uk-button-default uk-margin-small-right uk-margin-small-bottom" href="/docs">Documentation</a>
                <a class="uk-button uk-button-secondary uk-margin-small-right uk-margin-small-bottom" href="/products">Products</a>
                <a class="uk-button uk-button-text uk-margin-small-bottom" href="/contact">Contact us</a>
              </p>
            </div>
            <div class="uk-width-1-2@m">
              <img src="/sites/default/files/webship-portal/designer-two-screen-setup.jpg" data-entity-type="file" data-entity-uuid="c1ee34f8-c6b3-5200-a36e-9628111c725e" width="1800" height="1202" alt="A designer's desk at night with two screens showing code and a web page." class="uk-border-rounded uk-box-shadow-large">
            </div>
          </div>
        </div>

        <h2 class="uk-heading-line uk-text-center"><span>What Webship offers</span></h2>
        <div class="uk-grid-match uk-child-width-1-2@s uk-child-width-1-3@m uk-margin-medium-top" uk-grid>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: file-text; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">Site templates</h3>
              <p>Start from a complete site: the Website Starter for a company or a blog, the Webship Portal to manage software, the Webship Starter for documentation.</p>
              <a class="uk-button uk-button-text" href="/products/website-starter">Learn more</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: download; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">The Webship installer</h3>
              <p>Choose a site template in the installer, or install one with Drush. Every template works on its own, with no extra setup.</p>
              <a class="uk-button uk-button-text" href="/docs/choose-a-site-template">Learn more</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: album; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">Documentation</h3>
              <p>Guides to install and use Webship, at /docs. Web Doc pages can also be organized in books with their own navigation.</p>
              <a class="uk-button uk-button-text" href="/docs">Learn more</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: tag; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">Products and releases</h3>
              <p>A page for each product with its release notes, versions and download links, listed at /products.</p>
              <a class="uk-button uk-button-text" href="/products">Learn more</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: mail; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">Newsletter</h3>
              <p>A newsletter subscription form, built with Webform, with anti-spam protection.</p>
              <a class="uk-button uk-button-text" href="/newsletter/subscribe">Learn more</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-hover uk-card-body uk-height-1-1">
              <span class="uk-text-primary" uk-icon="icon: paint-bucket; ratio: 1.6"></span>
              <h3 class="uk-card-title uk-margin-small-top">Display Builder and UIkit</h3>
              <p>Arrange every page with Display Builder and SDC components, in Webtheme, generated from UI Suite UIkit.</p>
              <a class="uk-button uk-button-text" href="/docs/build-pages-with-display-builder">Learn more</a>
            </div>
          </div>
        </div>

        <div class="uk-grid uk-grid-large uk-flex-middle uk-margin-xlarge-top" uk-grid>
          <div class="uk-width-1-2@m">
            <img src="/sites/default/files/webship-portal/developer-laptop-code.jpg" data-entity-type="file" data-entity-uuid="1c8572c9-9fde-580c-b429-8a7348519fca" width="1800" height="1200" alt="A developer writing code on a laptop." class="uk-border-rounded uk-box-shadow-medium">
          </div>
          <div class="uk-width-1-2@m">
            <h2>Pick a site template, get a full site</h2>
            <p>The Webship installer lists the site templates next to each other. Each one applies the Webship recipes it needs: content types, media, SEO, security, dashboards and a theme.</p>
            <ul class="uk-list uk-list-bullet">
              <li>Website Starter, Webship Starter and Webship Portal.</li>
              <li>Drupal 11.4 and PHP 8.4, installed with DDEV.</li>
              <li>No extra modules to enable after the install.</li>
            </ul>
            <a class="uk-button uk-button-primary" href="/docs/choose-a-site-template">Choose a site template</a>
          </div>
        </div>

        <div class="uk-grid uk-grid-large uk-flex-middle uk-margin-xlarge-top" uk-grid>
          <div class="uk-width-1-2@m uk-flex-last@m">
            <img src="/sites/default/files/webship-portal/code-editor-laptop.jpg" data-entity-type="file" data-entity-uuid="451c9dff-6ef7-5b16-92f6-ee5f64482f7c" width="1800" height="1195" alt="A code editor with test code on a laptop screen." class="uk-border-rounded uk-box-shadow-medium">
          </div>
          <div class="uk-width-1-2@m">
            <h2>Design pages with Display Builder</h2>
            <p>Content types are displayed with Display Builder: drag components and fields, preview, and publish. Webtheme provides the UIkit components, colors and icons of Webship.co.</p>
            <a class="uk-button uk-button-primary" href="/docs/build-pages-with-display-builder">Build pages</a>
          </div>
        </div>

        <div class="uk-grid uk-grid-large uk-flex-middle uk-margin-xlarge-top" uk-grid>
          <div class="uk-width-1-2@m">
            <img src="/sites/default/files/webship-portal/team-planning-laptops.jpg" data-entity-type="file" data-entity-uuid="f405f0c9-ac5f-5dab-abde-2f22e8011c45" width="1800" height="1202" alt="Two people planning a project with laptops and printed notes." class="uk-border-rounded uk-box-shadow-medium">
          </div>
          <div class="uk-width-1-2@m">
            <h2>Dashboards for the whole team</h2>
            <p>Site administrators get the Webmaster dashboard with the site status and recent content. Content editors get the Editorial dashboard with their drafts and shortcuts.</p>
            <a class="uk-button uk-button-primary" href="/docs/dashboards">Read about the dashboards</a>
          </div>
        </div>

        <div class="uk-card uk-card-secondary uk-card-body uk-border-rounded uk-text-center uk-margin-xlarge-top">
          <h2 class="uk-margin-remove-top">Planning a website with Webship?</h2>
          <p>Tell us about your project, or subscribe to the newsletter below to hear about new releases.</p>
          <a class="uk-button uk-button-primary" href="/contact">Contact us</a>
        </div>
      format: full_html
      summary: ''
