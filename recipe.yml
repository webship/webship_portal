name: 'Webship Portal'
description: 'The Webship.co portal site template: a site about automated functional testing, with products and releases, services, documentation, a blog, a newsletter and a contact page, in the Webtheme theme with the Webship.co colors and design. Built on top of Drupal and Display Builder. No Canvas, no Layout Builder.'
type: 'Site'
# Site template metadata for the Webship installer.
extra:
  webship_installer:
    creator: 'Webship'
# A site template works on its own: it applies the default recipes of the
# Webship modules, Web Dashboard and core recipes, never another site template.
recipes:
  # Webship content types and media, before the roles: the roles reference
  # their permissions. Webpage first: it installs Node.
  - modules/contrib/webpage/recipes/default
  - modules/contrib/webassets/recipes/default
  - modules/contrib/webdev/recipes/default
  - core/recipes/tags_taxonomy
  # The core recipes of the text formats, the admin theme, the roles and the
  # recommended settings. No core front-end theme recipe: Drupal 12 removed
  # it, and the front-end theme is installed below.
  - core/recipes/basic_block_type
  - core/recipes/basic_html_format_editor
  - core/recipes/full_html_format_editor
  - core/recipes/core_recommended_performance
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_admin_theme
  # The front-end theme, before the feature recipes: the editor recipes
  # need an installed default theme. Drupal 12 has no core front-end theme
  # recipe, so the template ships its own, inside this package.
  - ../recipes/webship_portal/recipes/front_end_theme
  - core/recipes/user_picture
  - core/recipes/restricted_html_format
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  # The Webship administration, SEO and security features. Web Admin comes
  # after the core admin theme recipe: it sets UIkit Admin as the
  # administration theme, sign-in screens included.
  - modules/contrib/webadmin/recipes/default
  - modules/contrib/webseo/recipes/default
  - modules/contrib/websecurity/recipes/default
  # The report of the patches applied to this site.
  - modules/contrib/webpatches/recipes/default
  # The default dashboards of the Webship site templates, built with Display
  # Builder: Webmaster for site administrators, Editorial for content editors.
  - webdash
  # Webship features: editor and configuration management.
  - modules/contrib/webeditor/recipes/default
  - modules/contrib/webconfig/recipes/default
  # The Web AI tools and providers. Listing the recipe here is needed: a
  # recipe installs modules with config entity installation disabled, so
  # the install hook of the Web AI module cannot apply its own recipe.
  - modules/contrib/webai/recipes/default
  # The Webship features: documentation, products and releases, a blog and a
  # newsletter.
  - modules/contrib/webdoc/recipes/default
  - modules/contrib/webreleases/recipes/default
  - modules/contrib/webblog/recipes/default
  - modules/contrib/webnewsletter/recipes/default
install:
  # The search form of the documentation.
  - search
  - search_node
  # Social sharing.
  - webshare
  # Theme.
  - webtheme
config:
  strict: false
  import:
    # The bulk actions of the content overview: publish, unpublish, delete.
    node:
      - system.action.node_delete_action
      - system.action.node_make_sticky_action
      - system.action.node_make_unsticky_action
      - system.action.node_promote_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpromote_action
      - system.action.node_unpublish_action
    # The search page and the view modes of the search index.
    search_node: '*'
    # The blocks of Webtheme are optional config, placed in the regions of
    # its UIkit page: the site branding, main and account menus in the navbar,
    # the main and account menus in the offcanvas on small screens, the
    # breadcrumbs in the header, the footer and social media menus and
    # "Powered by" in the footer. The social media menu itself is config of
    # the template, installed with these blocks.
    webtheme:
      - block.block.webtheme_account_menu
      - block.block.webtheme_account_menu_offcanvas
      - block.block.webtheme_breadcrumbs
      - block.block.webtheme_content
      - block.block.webtheme_footer_menu
      - block.block.webtheme_help
      - block.block.webtheme_main_menu
      - block.block.webtheme_main_menu_offcanvas
      - block.block.webtheme_messages
      - block.block.webtheme_powered
      - block.block.webtheme_primary_admin_actions
      - block.block.webtheme_primary_local_tasks
      - block.block.webtheme_secondary_local_tasks
      - block.block.webtheme_site_branding
      - block.block.webtheme_social_media_menu
  actions:
    # The medium date format the Web Blog posts use. It came with the core
    # front-end theme recipe (Olivero), which Drupal 12 no longer has.
    core.date_format.olivero_medium:
      createIfNotExists:
        label: 'Olivero Medium'
        pattern: 'j F Y'
    # The pages are built with Display Builder components; the text parts
    # keep their images, so the text format of the builder allows them.
    filter.format.display_builder_html:
      setFilterConfig:
        instance_id: filter_html
        configuration:
          id: filter_html
          provider: filter
          status: true
          weight: -10
          settings:
            allowed_html: '<a href hreflang class> <em class> <i class> <strong class> <ul type class> <ol start type="1 A I" class> <li class> <h2 id class> <h3 id class> <h4 id class> <h5 id class> <h6 id class> <p class> <img src alt width height class loading> <figure class> <figcaption class> <code class> <kbd class> <br> <span class> <drupal-icon data-icon-id data-icon-settings class role aria-label aria-hidden>'
            filter_html_help: true
            filter_html_nofollow: false
    system.theme:
      simpleConfigUpdate:
        default: webtheme
    # The Webship icon in the browser tab of every page: the site, the sign-in
    # screens and the administration pages.
    system.theme.global:
      simpleConfigUpdate:
        favicon.use_default: false
        favicon.path: 'themes/contrib/webtheme/favicon.ico'
    # The Webship.co logo carries the name: the sign-in screens show the logo
    # alone. Needs UIkit Admin 4.0.3.
    uikit_admin.settings:
      simpleConfigUpdate:
        sign_in_brand: logo
    # The navbar shows only the Webship logo, linked to the front page.
    block.block.webtheme_site_branding:
      setProperties:
        settings.use_site_logo: true
        settings.use_site_name: false
        settings.use_site_slogan: false
    system.site:
      simpleConfigUpdate:
        name: 'Webship.co'
        # The front page of the template, in content/node. No slogan.
        slogan: ''
        page.front: /home
    # The products page is a page of the template, at /products, which groups
    # the products: the listing page of Web Releases gives it the path.
    views.view.products:
      # A view is a config entity too: setProperties, not simpleConfigUpdate.
      setProperties:
        display.products_page.display_options.enabled: false
    # Release versions keep their dots in the URL: /releases/2.0.6.
    pathauto.settings:
      simpleConfigUpdate:
        punctuation.period: 2
    # A page can carry its own display, built with Display Builder: the home,
    # services, documentation, about and contact pages of the template do. A
    # page without one shows its body.
    core.entity_view_display.node.webpage.full:
      setThirdPartySettings:
        -
          module: display_builder
          key: override_field
          value: field_page_display
        -
          module: display_builder
          key: override_profile
          value: default
    # The page layout prints the title of every page, so a blog post shows
    # its image, its date and its text.
    core.entity_view_display.node.webblog.full:
      setThirdPartySetting:
        module: display_builder
        key: sources
        value:
          -
            source_id: entity_field
            source:
              derivable_context: 'field:node:webblog:field_media'
              'field:node:webblog:field_media':
                value:
                  sources:
                    -
                      source_id: 'field_formatter:node:webblog:field_media'
                      source:
                        type: entity_reference_entity_view
                        label: hidden
                        settings:
                          view_mode: ultrawide
                        third_party_settings: {  }
                        weight: -10
          -
            source_id: entity_field
            source:
              derivable_context: 'field:node:webblog:created'
              'field:node:webblog:created':
                value:
                  sources:
                    -
                      source_id: 'field_formatter:node:webblog:created'
                      source:
                        type: timestamp
                        label: hidden
                        settings:
                          date_format: custom
                          custom_date_format: 'M d, Y'
                          timezone: ''
                        third_party_settings: {  }
                        weight: -9
          -
            source_id: entity_field
            source:
              derivable_context: 'field:node:webblog:field_body'
              'field:node:webblog:field_body':
                value:
                  sources:
                    -
                      source_id: 'field_formatter:node:webblog:field_body'
                      source:
                        type: text_default
                        label: hidden
                        settings: {  }
                        third_party_settings: {  }
                        weight: -7
    # Every content type moves through the editorial workflow, so an editor
    # can save a draft and unpublish content.
    workflows.workflow.editorial:
      addNodeTypes:
        - product
        - release
        - webblog
        - webdoc
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'search content'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'delete own files'
        - 'search content'
    # Content editors manage the content of every content type of the site,
    # and move content through the editorial workflow.
    user.role.content_editor:
      grantPermissions:
        - 'access content overview'
        - 'access contextual links'
        - 'access files overview'
        - 'access taxonomy overview'
        - 'administer url aliases'
        - 'create terms in tags'
        - 'create url aliases'
        - 'edit terms in tags'
        - 'delete own files'
        - 'revert all revisions'
        - 'use editorial transition archive'
        - 'use editorial transition archived_draft'
        - 'use editorial transition archived_published'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'use display builder default'
        - 'view all revisions'
        - 'view any unpublished content'
        - 'view latest version'
        - 'view the administration theme'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete any %bundle content'
        - 'delete own %bundle content'
        - 'edit any %bundle content'
        - 'edit own %bundle content'
    # The contact form of Webship.co, with anti-spam protection.
    webform.webform.contact:
      # A webform is a config entity: Drupal 12 refuses simpleConfigUpdate on
      # it, setProperties works on Drupal 11 and 12.
      setProperties:
        elements: |-
          contact_paragraph:
            '#type': webform_markup
            '#markup': "<h2>We'd love to talk to you</h2><p>Leave us your details and we will contact you soon.</p>"
          layout_1:
            '#type': webform_flexbox
            name:
              '#type': textfield
              '#title': 'Your Name'
              '#placeholder': 'Your full name'
              '#required': true
              '#default_value': '[current-user:display-name]'
            company_name:
              '#type': textfield
              '#title': 'Company name'
              '#placeholder': 'Your company name'
          layout_2:
            '#type': webform_flexbox
            email:
              '#type': email
              '#title': 'Business email'
              '#placeholder': 'Your business email'
              '#required': true
              '#default_value': '[current-user:mail]'
            phone_number:
              '#type': textfield
              '#title': 'Phone number'
              '#placeholder': 'Your phone number'
          layout_3:
            '#type': webform_flexbox
            team_size:
              '#type': select
              '#title': 'Team Size'
              '#options':
                '1-10': '1-10 employees'
                '11-50': '11-50 employees'
                '51-100': '51-100 employees'
                '101-500': '101-500 employees'
                '501-1000': '501-1,000 employees'
                '1000+': '1,000+ employees'
            job_title:
              '#type': textfield
              '#title': 'Job title'
              '#placeholder': 'Your job title'
          message:
            '#type': textarea
            '#title': 'Your message'
            '#placeholder': 'Your message'
            '#required': true
          privacy:
            '#type': webform_markup
            '#markup': '<p>By contacting us through this form, you agree to our <a href="/privacy-policy">Privacy Policy</a>.</p>'
          actions:
            '#type': webform_actions
            '#title': 'Submit button(s)'
            '#submit__label': Submit
        third_party_settings.antibot.antibot: true
        third_party_settings.honeypot.honeypot: true
        third_party_settings.honeypot.time_restriction: true
